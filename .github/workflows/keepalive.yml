name: Keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without repository
# activity. This monitor is meant to be boring — long stretches with no commits are the
# NORMAL state, so that rule would silently switch it off exactly when it is working well.
# One empty commit a month resets the clock. Cheaper than remembering to check.

on:
  schedule:
    - cron: '23 6 1 * *'   # 06:23 on the 1st of every month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to reset the 60-day clock
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — keep scheduled workflows enabled"
          git push
